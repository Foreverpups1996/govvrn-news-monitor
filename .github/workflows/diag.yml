name: Диагностика доступа (временно)

# ВРЕМЕННЫЙ файл. Запускается автоматически при изменении самого себя,
# пишет результат в diag.txt и коммитит его, чтобы можно было прочитать без логов.

on:
  push:
    paths:
      - ".github/workflows/diag.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Проверить доступность
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          exec > diag.txt 2>&1
          echo "date=$(date -u +%FT%TZ)"
          echo "runner_ip=$(curl -sS --max-time 20 https://api.ipify.org || echo fail)"
          echo
          echo "=== govvrn.ru напрямую (2 попытки, таймаут 12с) ==="
          for i in 1 2; do
            code=$(curl -sS -o body.html -w "%{http_code} time=%{time_total}" --max-time 12 https://www.govvrn.ru/news/all 2>&1 || true)
            size=$(stat -c %s body.html 2>/dev/null || echo 0)
            echo "attempt $i: $code size=$size"
          done
          echo
          echo "=== t.me/s/govvrn36 (официальный TG-канал региона) ==="
          curl -sS -o tg.html -w "code=%{http_code} time=%{time_total} size=%{size_download}\n" --max-time 25 https://t.me/s/govvrn36 || true
          echo "кол-во сообщений (tgme_widget_message): $(grep -c 'tgme_widget_message_wrap' tg.html 2>/dev/null || echo 0)"
          echo "--- первые ~500 символов текста ---"
          sed -e 's/<[^>]*>/ /g' tg.html 2>/dev/null | tr -s ' \t\n' ' ' | head -c 500
          echo
          echo
          echo "=== vk.com/govvrn36 ==="
          curl -sS -o vk.html -w "code=%{http_code} time=%{time_total} size=%{size_download}\n" --max-time 25 https://vk.com/govvrn36 || true
          echo
          echo "=== бесплатные российские SOCKS5-прокси к govvrn.ru ==="
          curl -sS --max-time 20 "https://api.proxyscrape.com/v2/?request=getproxies&protocol=socks5&timeout=5000&country=RU" -o proxies.txt || true
          echo "получено прокси: $(wc -l < proxies.txt 2>/dev/null || echo 0)"
          head -n 8 proxies.txt | while read -r p; do
            if [ -n "$p" ]; then
              out=$(curl -sS -o /dev/null -w "%{http_code} time=%{time_total}" --max-time 12 --socks5-hostname "$p" https://www.govvrn.ru/news/all 2>&1 || true)
              echo "proxy $p -> $out"
            fi
          done
          echo
          echo "=== telegram getMe ==="
          curl -sS --max-time 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe" | head -c 200 || echo "telegram: fail"
          echo
          echo "done"

      - name: Сохранить результат
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag.txt
          git commit -m "Диагностика доступа [skip ci]" || echo "нет изменений"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push || true
