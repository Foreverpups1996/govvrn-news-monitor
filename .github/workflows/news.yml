name: Новости govvrn.ru → Telegram

on:
  schedule:
    # Каждые 15 минут (время UTC; MSK = UTC+3)
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      send_latest:
        description: "Сколько свежих новостей отправить сразу (0 — обычная проверка)"
        required: false
        default: "0"
        type: string

permissions:
  contents: write

# Чтобы параллельные запуски не конфликтовали при записи состояния
concurrency:
  group: news-monitor
  cancel-in-progress: false

jobs:
  check-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Проверить новости и отправить в Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_PROXY: ${{ secrets.TELEGRAM_PROXY }}
          SEND_LATEST: ${{ inputs.send_latest }}
        run: python news_monitor.py

      - name: Сохранить состояние (чтобы не слать дубли)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "Состояние не изменилось."
          else
            git commit -m "Обновление состояния новостей [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push && break
              echo "Пуш не удался, попытка $i..."
              sleep 10
            done
            git push || true
          fi
